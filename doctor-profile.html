<!DOCTYPE html>
<html lang="en" data-theme="teal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile — AIS Hospital | Senior Medical Consultant</title>
    <meta name="description" content="View complete doctor credentials, clinical expertise, OPD timings, education, and patient reviews at AIS Hospital.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: 'var(--primary)',
                            dark: 'var(--primary-dark)',
                            light: 'var(--primary-light)',
                            50: 'var(--primary-50)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Manrope', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="assets/css/themes.css">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="doctor-profile" class="bg-slate-50 text-slate-800 antialiased selection:bg-primary-100 selection:text-primary-dark">

    <div id="emergency-bar-placeholder"></div>
    <div id="header-placeholder"></div>

    <main id="main-content">
        <!-- Profile Container Dynamically Populated by app.js -->
        <div id="doctor-profile-container" class="min-h-[500px]">
            <div class="max-w-7xl mx-auto px-4 py-16 text-center">
                <div class="inline-block animate-spin w-8 h-8 border-4 border-primary border-t-transparent rounded-full mb-4"></div>
                <p class="text-sm text-slate-500">Loading doctor credentials...</p>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/validation.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
